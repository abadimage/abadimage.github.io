<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jinocarlo Abad — engineer, photographer, videographer</title>
<meta name="description" content="Infrastructure architect and software engineer. AI/ML pipelines, homelab, photography, video. San Jose, CA." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">

<style>
:root {
  --paper:       #f4ead8;
  --paper-light: #faf5e9;
  --ink:         #1a1a1a;
  --ink-soft:    #3d342a;
  --ink-muted:   #7d6f5d;
  --accent:      #d94e2e;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Lora', Georgia, serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  background-color: var(--paper);
  background-image:
    radial-gradient(circle at 18% 12%, rgba(0,0,0,0.025) 0, transparent 50%),
    radial-gradient(circle at 82% 78%, rgba(0,0,0,0.02)  0, transparent 50%),
    linear-gradient(rgba(80, 90, 110, 0.12) 1px, transparent 1px);
  background-size: auto, auto, 100% 30px;
  background-attachment: fixed, fixed, local;
  min-height: 100vh;
}

/* Selection */
::selection { background: rgba(217, 78, 46, 0.22); color: var(--ink); }

/* Focus styles */
a:focus-visible, button:focus-visible {
  outline: 2.5px solid var(--accent);
  outline-offset: 3px;
  border-radius: 2px;
}

/* Smooth scroll for in-page anchors */
html { scroll-behavior: smooth; scroll-padding-top: 90px; }

/* Image defaults */
img { display: block; max-width: 100%; }

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  html { scroll-behavior: auto; }
}

/* ─── Responsive ─── */
/* Stamps: SVG scales to fit its grid cell instead of forcing the cell wider */
.stamps-row svg {
  width: 100%;
  height: auto;
  max-width: 170px;
}

@media (max-width: 860px) {
  .hero-grid       { grid-template-columns: 1fr !important; gap: 28px !important; }

  /* Restack the hero collage as a small overlapping flex column */
  .hero-collage {
    position: relative !important;
    width: 100% !important;
    height: auto !important;
    max-width: 360px !important;
    margin: 8px auto 0 !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: stretch !important;
    padding: 16px 0 8px !important;
  }
  .hero-collage > * {
    position: relative !important;
    top: auto !important; left: auto !important; right: auto !important; bottom: auto !important;
  }
  /* Polaroid widths are now percentage-based so they scale with the collage cell */
  .hero-pola-1 {
    width: 66% !important;
    max-width: 220px !important;
    align-self: flex-start !important;
    margin-left: 6% !important;
  }
  .hero-pola-2 {
    width: 62% !important;
    max-width: 200px !important;
    align-self: flex-end !important;
    margin-right: 4% !important;
    margin-top: -52px !important;
  }
  .hero-sticky {
    align-self: flex-start !important;
    margin-left: 8% !important;
    margin-top: -28px !important;
    transform: rotate(-3deg) !important;
    max-width: 60% !important;
  }

  .status-grid     { grid-template-columns: 1fr !important; }
  .stamps-row      { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; gap: 20px !important; }
  .stamps-stories  { grid-template-columns: 1fr !important; }
}

@media (max-width: 520px) {
  .stamps-row      { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 12px !important; }
  .stamps-row svg  { max-width: 140px !important; }

  .hero-collage    { max-width: 320px !important; }
  .hero-pola-2     { margin-top: -42px !important; }

  nav h1, nav a    { font-size: 26px !important; }
}

@media (max-width: 380px) {
  .stamps-row svg  { max-width: 120px !important; }
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script type="text/babel" src="site-components.jsx"></script>
<script type="text/babel" src="site-sections-1.jsx"></script>
<script type="text/babel" src="site-sections-2.jsx"></script>
<script type="text/babel" src="site-app.jsx"></script>
</body>
</html>
